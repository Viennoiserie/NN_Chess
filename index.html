<body>

<h1>NN Chess</h1>
<p class="subtitle">Neural Network Chess Engine — Viennoiserie</p>

<div class="layout">

  <!-- ── Setup Panel ── -->
  <div class="panel">
    <div class="panel-title">Configuration</div>

    <label>Couleur</label>
    <div class="color-toggle">
      <button class="color-btn active" id="btn-white" onclick="setColor('white')">Blancs ♙</button>
      <button class="color-btn"        id="btn-black" onclick="setColor('black')">Noirs ♟</button>
    </div>

    <label>
      <div class="temp-row">
        Température <span class="temp-val" id="temp-val">1.0</span>
      </div>
    </label>
    <input type="range" id="temp" min="0.1" max="2.0" step="0.1" value="1.0"
           oninput="document.getElementById('temp-val').textContent = parseFloat(this.value).toFixed(1)">

    <button class="btn"           onclick="startGame()">▶ Nouvelle Partie</button>
    <button class="btn btn-secondary" onclick="resetGame()">↺ Recommencer</button>

    <div style="margin-top:20px; padding-top:14px; border-top:1px solid var(--border);
                font-size:0.78rem; color:var(--text-dim); line-height:1.9;">
      Modèle <br><span style="color:var(--text)" id="info-model">—</span><br>
      Coups uniques <br><span style="color:var(--text)" id="info-moves">—</span>
    </div>
  </div>

  <!-- ── Board ── -->
  <div class="board-area">
    <div id="status" class="loading">Chargement du modèle...</div>
    <div id="board-wrap"></div>
  </div>

  <!-- ── Move Log ── -->
  <div class="move-log">
    <div class="panel-title">Coups</div>
    <div id="moves-scroll"></div>
  </div>

</div>

<div id="overlay">
  <div class="spinner"></div>
  Réflexion en cours...
</div>

<script>
// ════════════════════════════════════════════
// Configuration
// ════════════════════════════════════════════

const MODEL_URL       = 'Web/model.onnx';
const MOVE_TO_INT_URL = 'Web/move_to_int.json';
const TEMPERATURE     = () => parseFloat(document.getElementById('temp').value);

// ════════════════════════════════════════════
// State
// ════════════════════════════════════════════

let ortSession  = null;
let moveToInt   = null;
let intToMove   = null;
let game        = null;
let board       = null;
let humanColor  = 'white';
let moveHistory = [];
let gameStarted = false;
let modelReady  = false;

// ════════════════════════════════════════════
// Init : chargement modèle + dictionnaire
// ════════════════════════════════════════════

async function init() {
  setStatus('Chargement du modèle...', 'loading');
  try {
    // Chargement parallèle du modèle ONNX et du dictionnaire de coups
    const [session, dict] = await Promise.all([
      ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] }),
      fetch(MOVE_TO_INT_URL).then(r => r.json())
    ]);

    ortSession = session;
    moveToInt  = dict;
    intToMove  = Object.fromEntries(Object.entries(dict).map(([k, v]) => [v, k]));

    modelReady = true;

    document.getElementById('info-model').textContent  = 'web/model.onnx';
    document.getElementById('info-moves').textContent  = Object.keys(dict).length;

    setStatus('Configurez et démarrez une partie.', '');
    initBoard();

  } catch (e) {console.error("MODEL LOAD ERROR:", e);

    setStatus('Erreur : ' + (e?.message || e),
              'over');
  }
}

// ════════════════════════════════════════════
// Plateau (chessboard.js)
// ════════════════════════════════════════════

function initBoard() {
  game = new Chess();

  board = Chessboard('board-wrap', {
    draggable:     true,
    position:      'start',
    pieceTheme:    'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart:   onDragStart,
    onDrop:        onDrop,
    onSnapEnd:     () => board.position(game.fen()),
  });
}

function onDragStart(source, piece) {
  if (!gameStarted)               return false;
  if (game.game_over())           return false;
  if (game.turn() !== humanColor[0]) return false;
  // Autorise uniquement les pièces de la couleur humaine
  if (humanColor === 'white' && piece.startsWith('b')) return false;
  if (humanColor === 'black' && piece.startsWith('w')) return false;
}

async function onDrop(source, target) {
  // Vérifie si le coup est légal (gestion promotion automatique en dame)
  const move = game.move({ from: source, to: target, promotion: 'q' });
  if (move === null) return 'snapback';

  addMoveToLog(move.san, 'human');
  updateStatus();

  if (!game.game_over()) {
    await aiMove();
  }
}

// ════════════════════════════════════════════
// Inférence ONNX
// ════════════════════════════════════════════

function encodeBoard(chess) {
  // Encodage du plateau en tensor (13, 8, 8) — doit correspondre à board.py
  // 12 canaux pièces (6 types × 2 couleurs) + 1 canal tour
  const tensor = new Float32Array(13 * 8 * 8);

  const pieceIdx = { p: 0, n: 1, b: 2, r: 3, q: 4, k: 5 };

  for (let rank = 0; rank < 8; rank++) {
    for (let file = 0; file < 8; file++) {
      const sq    = String.fromCharCode(97 + file) + (rank + 1);
      const piece = chess.get(sq);
      if (piece) {
        const base    = pieceIdx[piece.type];
        const channel = piece.color === 'w' ? base : base + 6;
        tensor[channel * 64 + rank * 8 + file] = 1.0;
      }
    }
  }

  // Canal 12 : tour (1 = blancs, 0 = noirs)
  const turnVal = chess.turn() === 'w' ? 1.0 : 0.0;
  for (let i = 0; i < 64; i++) tensor[12 * 64 + i] = turnVal;

  return tensor;
}

async function aiMove() {
  showOverlay(true);

  // Légère pause pour laisser le DOM se mettre à jour
  await new Promise(r => setTimeout(r, 50));

  const encoded = encodeBoard(game);
  const inputTensor = new ort.Tensor('float32', encoded, [1, 13, 8, 8]);

  const results = await ortSession.run({ input: inputTensor });
  const logits  = results.output.data;

  // Récupération des coups légaux connus du modèle
  const legalMoves = game.moves({ verbose: true });
  const legalUcis  = legalMoves.map(m => m.from + m.to + (m.promotion || ''));

  const candidates = legalUcis
    .map((uci, i) => ({ move: legalMoves[i], uci, idx: moveToInt[uci] }))
    .filter(c => c.idx !== undefined);

  let chosen;

  if (candidates.length === 0) {
    // Aucun coup connu : coup aléatoire
    chosen = legalMoves[Math.floor(Math.random() * legalMoves.length)];
  } else {
    // Application de la température et softmax sur les coups légaux connus
    const temp    = TEMPERATURE();
    const rawLogits = candidates.map(c => logits[c.idx] / temp);
    const maxL    = Math.max(...rawLogits);
    const exps    = rawLogits.map(l => Math.exp(l - maxL));
    const sumExp  = exps.reduce((a, b) => a + b, 0);
    const probs   = exps.map(e => e / sumExp);

    // Échantillonnage selon la distribution de probabilité
    let rand = Math.random();
    let idx  = 0;
    for (; idx < probs.length - 1; idx++) {
      rand -= probs[idx];
      if (rand <= 0) break;
    }

    chosen = candidates[idx].move;
  }

  game.move({ from: chosen.from, to: chosen.to, promotion: chosen.promotion || 'q' });
  board.position(game.fen());
  addMoveToLog(chosen.san, 'ai');
  updateStatus();
  showOverlay(false);
}

// ════════════════════════════════════════════
// Contrôles
// ════════════════════════════════════════════

function setColor(color) {
  humanColor = color;
  document.getElementById('btn-white').classList.toggle('active', color === 'white');
  document.getElementById('btn-black').classList.toggle('active', color === 'black');
}

async function startGame() {
  if (!modelReady) return;

  game = new Chess();
  moveHistory = [];
  gameStarted = true;
  document.getElementById('moves-scroll').innerHTML = '';

  const orientation = humanColor === 'white' ? 'white' : 'black';
  board.orientation(orientation);
  board.position('start');

  updateStatus();

  // Si l'humain joue les noirs, l'IA commence
  if (humanColor === 'black') {
    await aiMove();
  }
}

function resetGame() {
  if (!gameStarted) return;
  game = new Chess();
  moveHistory = [];
  board.position('start');
  document.getElementById('moves-scroll').innerHTML = '';
  updateStatus();

  if (humanColor === 'black') aiMove();
}

// ════════════════════════════════════════════
// Move log
// ════════════════════════════════════════════

function addMoveToLog(san, who) {
  moveHistory.push({ san, who });
  rebuildLog();
}

function rebuildLog() {
  const scroll  = document.getElementById('moves-scroll');
  scroll.innerHTML = '';
  const aiFirst = humanColor === 'black';

  let i = 0, num = 1;
  while (i < moveHistory.length) {
    const row = document.createElement('div');
    row.className = 'move-row';

    const mn = document.createElement('div');
    mn.className = 'mn';
    mn.textContent = num + '.';
    row.appendChild(mn);

    // Colonne Blancs
    const w = document.createElement('div');
    w.className = 'mw' + (aiFirst ? ' ai' : '');
    w.textContent = moveHistory[i]?.san || '';
    row.appendChild(w);
    i++;

    // Colonne Noirs
    const b = document.createElement('div');
    b.className = 'mb' + (!aiFirst ? ' ai' : '');
    b.textContent = moveHistory[i]?.san || '';
    row.appendChild(b);
    i++;

    scroll.appendChild(row);
    num++;
  }
  scroll.scrollTop = scroll.scrollHeight;
}

// ════════════════════════════════════════════
// UI helpers
// ════════════════════════════════════════════

function updateStatus() {
  if (!gameStarted) { setStatus('Configurez et démarrez une partie.', ''); return; }

  if (game.in_checkmate()) {
    const winner = game.turn() === 'w' ? 'Noirs' : 'Blancs';
    setStatus(`Échec et mat — Victoire des ${winner} !`, 'over');
  } else if (game.in_draw()) {
    setStatus('Match nul', 'over');
  } else if (game.in_check()) {
    const turn = game.turn() === humanColor[0] ? 'Votre roi est en échec !' : 'Le roi adverse est en échec.';
    setStatus(turn, 'active');
  } else {
    const yourTurn = game.turn() === humanColor[0];
    setStatus(yourTurn ? 'Votre tour' : 'Tour du modèle...', yourTurn ? 'active' : 'loading');
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className   = cls;
}

function showOverlay(show) {
  document.getElementById('overlay').classList.toggle('show', show);
}

// ════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════
init();
</script>
</body>
